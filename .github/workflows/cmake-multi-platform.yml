name: MatEdit Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  build-linux-gcc:
    name: Build Linux x64 GCC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DGLFW_BUILD_X11=ON

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Package
        run: |
          mkdir -p package

          cp build/MaterialEditor package/MaterialEditor
          cp CONTRIBUTORS.txt package/CONTRIBUTORS.txt

          tar -czf MatEdit-linux-x64-gcc.tar.gz \
            -C package \
            MaterialEditor \
            CONTRIBUTORS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatEdit-linux-x64-gcc
          path: MatEdit-linux-x64-gcc.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-linux-clang:
    name: Build Linux x64 Clang
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DGLFW_BUILD_X11=ON

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Package
        run: |
          mkdir -p package

          cp build/MaterialEditor package/MaterialEditor
          cp CONTRIBUTORS.txt package/CONTRIBUTORS.txt

          tar -czf MatEdit-linux-x64-clang.tar.gz \
            -C package \
            MaterialEditor \
            CONTRIBUTORS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatEdit-linux-x64-clang
          path: MatEdit-linux-x64-clang.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows x64 MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path package | Out-Null

          Copy-Item `
            build\Release\MaterialEditor.exe `
            package\MaterialEditor.exe

          Copy-Item `
            CONTRIBUTORS.txt `
            package\CONTRIBUTORS.txt

          Compress-Archive `
            -Path @(
              'package\MaterialEditor.exe',
              'package\CONTRIBUTORS.txt'
            ) `
            -DestinationPath MatEdit-windows-x64-msvc.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatEdit-windows-x64-msvc
          path: MatEdit-windows-x64-msvc.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Nightly Release
    runs-on: ubuntu-latest

    needs:
      - build-linux-gcc
      - build-linux-clang
      - build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Download Linux GCC package
        uses: actions/download-artifact@v4
        with:
          name: MatEdit-linux-x64-gcc
          path: release

      - name: Download Linux Clang package
        uses: actions/download-artifact@v4
        with:
          name: MatEdit-linux-x64-clang
          path: release

      - name: Download Windows MSVC package
        uses: actions/download-artifact@v4
        with:
          name: MatEdit-windows-x64-msvc
          path: release

      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true

      - name: Remove all tags except nightly
        run: |
          set -e

          git fetch --tags --force

          git tag --list | while read -r tag; do
            if [ "$tag" != "nightly" ]; then
              echo "Deleting tag: $tag"
              git push origin ":refs/tags/$tag"
            fi
          done

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly \
            release/MatEdit-linux-x64-gcc.tar.gz \
            release/MatEdit-linux-x64-clang.tar.gz \
            release/MatEdit-windows-x64-msvc.zip \
            --target "${GITHUB_SHA}" \
            --title "MatEdit Nightly" \
            --prerelease

  deploy-aur-bin:
    name: Deploy matedit-bin to AUR
    runs-on: ubuntu-latest

    needs:
      - release

    steps:
      - name: Get package version
        id: version
        run: |
          echo "pkgver=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
              User aur
              IdentityFile ~/.ssh/aur
              IdentitiesOnly yes
          EOF

          chmod 600 ~/.ssh/config

      - name: Clone AUR repository
        run: |
          git clone ssh://aur@aur.archlinux.org/matedit-bin.git aur

      - name: Configure Git
        run: |
          cd aur

          git config user.name "${{ secrets.AUR_USERNAME }}"
          git config user.email "${{ secrets.AUR_EMAIL }}"

      - name: Update PKGBUILD
        working-directory: aur
        env:
          PKGVER: ${{ steps.version.outputs.pkgver }}
        run: |
          sed -i \
            "s/^pkgver=.*/pkgver=${PKGVER}/" \
            PKGBUILD

      - name: Install Arch build tools
        run: |
          docker run --rm \
            -v "$PWD/aur:/aur" \
            archlinux:latest \
            bash -c '
              pacman -Sy --noconfirm --needed base-devel &&
              cd /aur &&
              makepkg --printsrcinfo > .SRCINFO
            '

      - name: Commit and push
        working-directory: aur
        env:
          PKGVER: ${{ steps.version.outputs.pkgver }}
        run: |
          git add PKGBUILD .SRCINFO

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit \
            -m "Update to version ${PKGVER}"

          git push origin master
