name: MatEdit Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - SHA256SUMS
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  prepare-version:
    name: Determine AUR version
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -e

          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY secret is empty or missing"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
              HostName aur.archlinux.org
              User aur
              IdentityFile ~/.ssh/aur
              IdentitiesOnly yes
          EOF

          chmod 600 ~/.ssh/config

          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Clone matedit-bin AUR repository
        run: |
          set -e

          git clone \
            ssh://aur@aur.archlinux.org/matedit-bin.git \
            aur-bin

      - name: Determine package version
        id: version
        working-directory: aur-bin
        run: |
          set -e

          pkgver=$(date -u +%Y%m%d)

          current_pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          current_pkgrel=$(sed -n 's/^pkgrel=//p' PKGBUILD)

          if [ -z "$current_pkgver" ] || [ -z "$current_pkgrel" ]; then
            echo "Failed to read pkgver/pkgrel from PKGBUILD"
            exit 1
          fi

          if [ "$current_pkgver" = "$pkgver" ]; then
            pkgrel=$((10#$current_pkgrel + 1))
          else
            pkgrel=1
          fi

          echo "pkgver=${pkgver}" >> "$GITHUB_OUTPUT"
          echo "pkgrel=${pkgrel}" >> "$GITHUB_OUTPUT"

          echo "Current AUR version: ${current_pkgver}-${current_pkgrel}"
          echo "New version: ${pkgver}-${pkgrel}"

  build-linux-gcc:
    name: Build Linux x64 GCC
    runs-on: ubuntu-latest

    needs:
      - prepare-version

    env:
      PKGVER: ${{ needs.prepare-version.outputs.pkgver }}
      PKGREL: ${{ needs.prepare-version.outputs.pkgrel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DGLFW_BUILD_X11=ON

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Package
        run: |
          set -e

          mkdir -p package

          cp build/MaterialEditor package/MaterialEditor
          cp CONTRIBUTORS.txt package/CONTRIBUTORS.txt

          tar -czf \
            "MatEdit-linux-x64-gcc-${PKGVER}-${PKGREL}.tar.gz" \
            -C package \
            MaterialEditor \
            CONTRIBUTORS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatEdit-linux-x64-gcc
          path: MatEdit-linux-x64-gcc-${{ env.PKGVER }}-${{ env.PKGREL }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-linux-clang:
    name: Build Linux x64 Clang
    runs-on: ubuntu-latest

    needs:
      - prepare-version

    env:
      PKGVER: ${{ needs.prepare-version.outputs.pkgver }}
      PKGREL: ${{ needs.prepare-version.outputs.pkgrel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DGLFW_BUILD_X11=ON

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Package
        run: |
          set -e

          mkdir -p package

          cp build/MaterialEditor package/MaterialEditor
          cp CONTRIBUTORS.txt package/CONTRIBUTORS.txt

          tar -czf \
            "MatEdit-linux-x64-clang-${PKGVER}-${PKGREL}.tar.gz" \
            -C package \
            MaterialEditor \
            CONTRIBUTORS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatEdit-linux-x64-clang
          path: MatEdit-linux-x64-clang-${{ env.PKGVER }}-${{ env.PKGREL }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows x64 MSVC
    runs-on: windows-latest

    needs:
      - prepare-version

    env:
      PKGVER: ${{ needs.prepare-version.outputs.pkgver }}
      PKGREL: ${{ needs.prepare-version.outputs.pkgrel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path package | Out-Null

          Copy-Item `
            build\Release\MaterialEditor.exe `
            package\MaterialEditor.exe

          Copy-Item `
            CONTRIBUTORS.txt `
            package\CONTRIBUTORS.txt

          Compress-Archive `
            -Path @(
              'package\MaterialEditor.exe',
              'package\CONTRIBUTORS.txt'
            ) `
            -DestinationPath "MatEdit-windows-x64-msvc-$env:PKGVER-$env:PKGREL.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatEdit-windows-x64-msvc
          path: MatEdit-windows-x64-msvc-${{ env.PKGVER }}-${{ env.PKGREL }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Nightly Release
    runs-on: ubuntu-latest

    needs:
      - prepare-version
      - build-linux-gcc
      - build-linux-clang
      - build-windows

    env:
      PKGVER: ${{ needs.prepare-version.outputs.pkgver }}
      PKGREL: ${{ needs.prepare-version.outputs.pkgrel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Download Linux GCC package
        uses: actions/download-artifact@v4
        with:
          name: MatEdit-linux-x64-gcc
          path: release

      - name: Download Linux Clang package
        uses: actions/download-artifact@v4
        with:
          name: MatEdit-linux-x64-clang
          path: release

      - name: Download Windows MSVC package
        uses: actions/download-artifact@v4
        with:
          name: MatEdit-windows-x64-msvc
          path: release

      - name: Generate SHA256SUMS
        run: |
          set -e

          cd release

          sha256sum \
            "MatEdit-linux-x64-gcc-${PKGVER}-${PKGREL}.tar.gz" \
            "MatEdit-linux-x64-clang-${PKGVER}-${PKGREL}.tar.gz" \
            "MatEdit-windows-x64-msvc-${PKGVER}-${PKGREL}.zip" \
            > ../SHA256SUMS

          cat ../SHA256SUMS

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 1

      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true

      - name: Remove all tags except nightly
        run: |
          set -e

          git fetch --tags --force

          git tag --list | while read -r tag; do
            if [ "$tag" != "nightly" ]; then
              echo "Deleting tag: $tag"
              git push origin ":refs/tags/$tag"
            fi
          done

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly \
            "release/MatEdit-linux-x64-gcc-${PKGVER}-${PKGREL}.tar.gz" \
            "release/MatEdit-linux-x64-clang-${PKGVER}-${PKGREL}.tar.gz" \
            "release/MatEdit-windows-x64-msvc-${PKGVER}-${PKGREL}.zip" \
            --target "${GITHUB_SHA}" \
            --title "MatEdit Nightly ${PKGVER}-${PKGREL}" \
            --prerelease

      - name: Commit SHA256SUMS
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SHA256SUMS

          if git diff --cached --quiet; then
            echo "SHA256SUMS has no changes"
            exit 0
          fi

          git commit \
            -m "Update release checksums [skip ci]"

          git push origin HEAD:main

  deploy-aur:
    name: Deploy AUR package
    runs-on: ubuntu-latest

    needs:
      - prepare-version
      - release

    env:
      PKGVER: ${{ needs.prepare-version.outputs.pkgver }}
      PKGREL: ${{ needs.prepare-version.outputs.pkgrel }}

    steps:
      - name: Download release checksums
        uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: checksums

      - name: Get GCC package checksum
        id: checksum
        run: |
          set -e

          gcc_file="MatEdit-linux-x64-gcc-${PKGVER}-${PKGREL}.tar.gz"

          gcc_sha256=$(awk -v file="$gcc_file" '$2 == file {print $1}' checksums/SHA256SUMS)

          if [ -z "$gcc_sha256" ]; then
            echo "Failed to find GCC package checksum"
            exit 1
          fi

          echo "gcc_sha256=${gcc_sha256}" >> "$GITHUB_OUTPUT"
          echo "GCC SHA256: ${gcc_sha256}"

      - name: Configure SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -e

          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY secret is empty or missing"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
              HostName aur.archlinux.org
              User aur
              IdentityFile ~/.ssh/aur
              IdentitiesOnly yes
          EOF

          chmod 600 ~/.ssh/config

          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Clone matedit-bin AUR repository
        run: |
          set -e

          git clone \
            ssh://aur@aur.archlinux.org/matedit-bin.git \
            aur-bin

      - name: Configure Git identity
        run: |
          git -C aur-bin config user.name "${{ secrets.AUR_USERNAME }}"
          git -C aur-bin config user.email "${{ secrets.AUR_EMAIL }}"

      - name: Update matedit-bin PKGBUILD
        working-directory: aur-bin
        env:
          GCC_SHA256: ${{ steps.checksum.outputs.gcc_sha256 }}
        run: |
          set -e

          sed -i \
            "s/^pkgver=.*/pkgver=${PKGVER}/" \
            PKGBUILD

          sed -i \
            "s/^pkgrel=.*/pkgrel=${PKGREL}/" \
            PKGBUILD

          sed -E -i \
            "s|^    \"MatEdit-linux-x64-gcc-[^\"]+\.tar\.gz::https://github\.com/hgruntt/MatEdit/releases/download/nightly/MatEdit-linux-x64-gcc-[^\"]+\.tar\.gz\"|    \"MatEdit-linux-x64-gcc-${PKGVER}-${PKGREL}.tar.gz::https://github.com/hgruntt/MatEdit/releases/download/nightly/MatEdit-linux-x64-gcc-${PKGVER}-${PKGREL}.tar.gz\"|" \
            PKGBUILD

          sed -E -i \
            "s/^sha256sums=\('[^']*' 'SKIP'\)/sha256sums=('${GCC_SHA256}' 'SKIP')/" \
            PKGBUILD

          echo "Updated PKGBUILD:"
          grep -E '^(pkgver|pkgrel|source=|sha256sums=)' PKGBUILD

      - name: Update matedit-bin .SRCINFO
        working-directory: aur-bin
        env:
          GCC_SHA256: ${{ steps.checksum.outputs.gcc_sha256 }}
        run: |
          set -e

          sed -E -i \
            "s/^([[:space:]]*)pkgver = .*/\1pkgver = ${PKGVER}/" \
            .SRCINFO

          sed -E -i \
            "s/^([[:space:]]*)pkgrel = .*/\1pkgrel = ${PKGREL}/" \
            .SRCINFO

          sed -E -i \
            "s|^([[:space:]]*)source = MatEdit-linux-x64-gcc-[^[:space:]]+\.tar\.gz::https://github\.com/hgruntt/MatEdit/releases/download/nightly/MatEdit-linux-x64-gcc-[^[:space:]]+\.tar\.gz|\1source = MatEdit-linux-x64-gcc-${PKGVER}-${PKGREL}.tar.gz::https://github.com/hgruntt/MatEdit/releases/download/nightly/MatEdit-linux-x64-gcc-${PKGVER}-${PKGREL}.tar.gz|" \
            .SRCINFO

          awk -v hash="$GCC_SHA256" '
            BEGIN {
              count = 0
            }

            /^[[:space:]]*sha256sums = / {
              count++

              if (count == 1) {
                sub(/= .*/, "= " hash)
              }
            }

            {
              print
            }
          ' .SRCINFO > .SRCINFO.tmp

          mv .SRCINFO.tmp .SRCINFO

          if ! grep -Eq "^[[:space:]]*pkgver = ${PKGVER}$" .SRCINFO; then
            echo "Failed to update pkgver in .SRCINFO"
            exit 1
          fi

          if ! grep -Eq "^[[:space:]]*pkgrel = ${PKGREL}$" .SRCINFO; then
            echo "Failed to update pkgrel in .SRCINFO"
            exit 1
          fi

          if ! grep -Eq "^[[:space:]]*sha256sums = ${GCC_SHA256}$" .SRCINFO; then
            echo "Failed to update GCC SHA256 in .SRCINFO"
            exit 1
          fi

          if ! grep -Eq "MatEdit-linux-x64-gcc-${PKGVER}-${PKGREL}\.tar\.gz" .SRCINFO; then
            echo "Failed to update GCC source in .SRCINFO"
            exit 1
          fi

          echo ".SRCINFO synchronized:"
          grep -E "^[[:space:]]*(pkgver|pkgrel|source|sha256sums) = " .SRCINFO

      - name: Validate PKGBUILD and .SRCINFO
        working-directory: aur-bin
        env:
          GCC_SHA256: ${{ steps.checksum.outputs.gcc_sha256 }}
        run: |
          set -e

          if ! grep -Eq "^pkgver=${PKGVER}$" PKGBUILD; then
            echo "PKGBUILD pkgver mismatch"
            exit 1
          fi

          if ! grep -Eq "^pkgrel=${PKGREL}$" PKGBUILD; then
            echo "PKGBUILD pkgrel mismatch"
            exit 1
          fi

          if ! grep -Fq \
            "MatEdit-linux-x64-gcc-${PKGVER}-${PKGREL}.tar.gz::https://github.com/hgruntt/MatEdit/releases/download/nightly/MatEdit-linux-x64-gcc-${PKGVER}-${PKGREL}.tar.gz" \
            PKGBUILD; then
            echo "PKGBUILD GCC source mismatch"
            exit 1
          fi

          if ! grep -Fq \
            "sha256sums=('${GCC_SHA256}' 'SKIP')" \
            PKGBUILD; then
            echo "PKGBUILD SHA256 mismatch"
            exit 1
          fi

          if ! grep -Eq \
            "^pkgver = ${PKGVER}$" \
            .SRCINFO; then
            echo ".SRCINFO pkgver mismatch"
            exit 1
          fi

          if ! grep -Eq \
            "^pkgrel = ${PKGREL}$" \
            .SRCINFO; then
            echo ".SRCINFO pkgrel mismatch"
            exit 1
          fi

          if ! grep -Eq \
            "^sha256sums = ${GCC_SHA256}$" \
            .SRCINFO; then
            echo ".SRCINFO SHA256 mismatch"
            exit 1
          fi

          if ! grep -Fq \
            "MatEdit-linux-x64-gcc-${PKGVER}-${PKGREL}.tar.gz" \
            .SRCINFO; then
            echo ".SRCINFO GCC source mismatch"
            exit 1
          fi

          echo "AUR package metadata validation passed"

      - name: Commit and push matedit-bin
        working-directory: aur-bin
        run: |
          set -e

          git add PKGBUILD .SRCINFO

          if git diff --cached --quiet; then
            echo "matedit-bin has no changes"
            exit 0
          fi

          git commit \
            -m "Update to version ${PKGVER}-${PKGREL}"

          git push origin master
